name = "CFML (Tag)"
grammar = "cfml"
path_suffixes = ["cfm","cfc","cfml"]
autoclose_before = ";:.,=}])>"
block_comment = ["<!--- ", " --->"]
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "!---", end = " ---", close = true, newline = false, not_in = ["comment", "string"] },
]
prettier_parser_name = "cfml"
word_characters = ["-"]

[overrides.comment]
word_characters = []

[overrides.string]
word_characters = []
