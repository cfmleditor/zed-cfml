permissions:
  contents: write
  pull-requests: write
      
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[/!p;}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}

  zed-extension:
    name: Release Zed Extension
    runs-on: ubuntu-latest
    steps:
      - name: Validate extension token can access target repo
        run: |
          set -e
          TARGET_REPO="cfmleditor/extensions"
          if ! curl -sf -H "Authorization: token $COMMITTER_TOKEN" "https://api.github.com/repos/$TARGET_REPO" >/dev/null; then
            echo "ERROR: token cannot access $TARGET_REPO - check secret and token scopes/permissions"
            exit 1
          fi
        env:
          COMMITTER_TOKEN: ${{ secrets.ZED_EXTENSION_TOKEN }}
      - uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: cfml
          push-to: cfmleditor/extensions
        env:
          # the personal access token should have "repo" & "workflow" scopes
          COMMITTER_TOKEN: ${{ secrets.ZED_EXTENSION_TOKEN }}
